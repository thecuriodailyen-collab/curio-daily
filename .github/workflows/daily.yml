name: Daily Short

on:
  schedule:
    - cron: "0 17 * * *"   # 17:00 UTC = 12:00 Toronto (winter) / 13:00 (summer)
  workflow_dispatch: {}      # "Run workflow" button for manual tests

permissions:
  contents: write

concurrency:
  group: daily-short
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-inter
      - name: Install Python packages
        run: pip install -r requirements.txt
      - name: Make and publish today's Short
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python daily.py
      - name: Keep a copy of the video (downloadable 14 days)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: short-${{ github.run_number }}
          path: out/*.mp4
          retention-days: 14
      - name: Save progress
        if: always()
        run: |
          git config user.name "curio-bot"
          git config user.email "curio-bot@users.noreply.github.com"
          git add posted.json
          [ -f generated.json ] && git add generated.json || true
          git diff --cached --quiet || git commit -m "Posted daily fact"
          git push
